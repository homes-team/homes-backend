spring:
  datasource:
    url: jdbc:postgresql://homes-postgres:5432/homes_db
    username: homes
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect # PostgreSQL 전용 설정 추가

server:
  port: 8080
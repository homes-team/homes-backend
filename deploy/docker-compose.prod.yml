services:
  app:
    image: rhdbqls/homes:latest
    container_name: homes-app
    env_file:
      - .env.prod
    ports:
      - "80:8080"
    depends_on:
      - homes-db
    restart: unless-stopped

  homes-db:
    image: postgres:15-alpine
    container_name: homes-db
    env_file:
      - .env.prod
    volumes:
      - ./_vol/postgres:/var/lib/postgresql/data
    restart: unless-stopped